<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rajGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#rajGrad)" />
  
  <!-- Subtle inner calculation grid lines -->
  <rect x="56" y="56" width="400" height="400" rx="64" fill="#0F172A" fill-opacity="0.2" />
  
  <!-- Calculator Display bar -->
  <rect x="96" y="96" width="320" height="72" rx="20" fill="#FFFFFF" fill-opacity="0.95" />
  <circle cx="132" cy="132" r="10" fill="#0EA5E9" />
  <circle cx="162" cy="132" r="10" fill="#14B8A6" />
  <!-- Display readout mockup -->
  <rect x="280" y="122" width="104" height="20" rx="6" fill="#1E293B" />
  
  <!-- Central Emblem: Stylized dynamic 'R' + Math calculation graph symbol -->
  <!-- Mathematical / Financial dynamic upward surge integrated with letter R -->
  <g fill="#FFFFFF">
    <!-- Stem of R -->
    <rect x="120" y="208" width="52" height="208" rx="16" />
    
    <!-- Top Bowl of R -->
    <path d="M 160 208 H 272 C 322 208 352 236 352 280 C 352 324 320 348 268 348 H 160 Z M 212 254 V 302 H 262 C 286 302 300 292 300 278 C 300 264 286 254 262 254 Z" />
    
    <!-- Dynamic Upward Diagonal Leg of R that transforms into a growth chart arrow -->
    <path d="M 248 336 L 340 416 H 404 L 304 330 Z" fill="url(#accentGrad)" />
    
    <!-- Floating calculation badges: plus, minus, equal, percent -->
    <circle cx="364" cy="228" r="14" fill="#38BDF8" />
    <path d="M 356 228 H 372 M 364 220 V 236" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
    
    <circle cx="388" cy="316" r="14" fill="#10B981" />
    <path d="M 380 312 H 396 M 380 320 H 396" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
